# Marketing site — web.orcatrial.net
#
# Install on the server:
#   sudo cp deploy/web.orcatrial.net.conf /etc/nginx/sites-available/orca-site
#   sudo ln -s /etc/nginx/sites-available/orca-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d web.orcatrial.net
#
# certbot rewrites this file in place to add the 443 block and the redirect.
# DNS first: A record "web" -> this box's public IP.

server {
    listen 80;
    server_name web.orcatrial.net;

    # The enquiry form posts JSON only — no uploads on this tier.
    client_max_body_size 1M;

    # Next serves hashed, immutable assets under /_next/static.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /api/register rate-limits per IP, so the real client address has to
        # survive the proxy hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
